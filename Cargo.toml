[package]
name = "efootball-kings-online"
version = "4.0.0"
description = "eFootball Kings Online desktop application"
authors = ["eFootball Kings"]
edition = "2021"

[lib]
name = "efootball_kings_online_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0" }

[dependencies]
tauri = { version = "2.5.0" }
tauri-plugin-opener = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
